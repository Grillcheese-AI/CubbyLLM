[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubbyllm"
version = "0.0.0"
description = "CubbyLLM — context-conditioned LM (theta=f(c)). Package skeleton."
requires-python = ">=3.12"
# torch/numpy/grilly are used by real components later; the skeleton itself
# imports none of them at module top level (TYPE_CHECKING only).
dependencies = []

[tool.setuptools.packages.find]
include = ["cubbyllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = false
addopts = "-q"
