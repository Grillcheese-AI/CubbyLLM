[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubbyllm"
version = "0.0.0"
description = "CubbyLLM — context-conditioned LM (theta=f(c)). Package skeleton."
requires-python = ">=3.12"
license = {text = "Apache-2.0"}   # cubbyllm/ (the trunk, the reasoning pipeline, the bridges); standin/ is BSL-1.1 -- see standin/LICENSE
# torch/numpy/grilly are used by real components later; the skeleton itself
# imports none of them at module top level (TYPE_CHECKING only).
dependencies = []

[project.optional-dependencies]
# grpcio-tools bundles its own protoc (no system protoc needed) and pulls in
# the `protobuf` runtime the pinned cubbyllm/bridges/reasoning_pb2.py stub
# imports. Regen command: see cubelang_client.py's module docstring.
dev = ["grpcio-tools"]

[tool.setuptools.packages.find]
include = ["cubbyllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = false
addopts = "-q"
