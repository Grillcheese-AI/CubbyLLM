<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cubby Loop Panel</title>

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0B0F14; --panel:#121820; --panel-2:#171F29; --line:#223040; --line-2:#2E3F52;
  --ink:#E7ECF2; --ink-2:#B9C6D4; --muted:#8393A6;
  --q:#F2F4F7; --plan:#B49CFF; --walk:#6FA8DC; --hop:#58C7D6; --fact:#46B39A; --fetch:#F2A65A; --gate:#D9924C;
  --vm:#E070C8; --alias:#C7B26B; --ok:#4ED39A; --bad:#EF6E6E; --latent:#E9B44C;
  --f-ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;
  padding-inline:0;overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:280px 1fr 340px;height:100vh;min-height:520px}
header{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
header .sub{color:var(--muted);font-family:var(--f-mono);font-size:11px}
header .spacer{flex:1}
.btn{font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--hop)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--hop);outline-offset:2px}
.ask{display:flex;gap:6px;align-items:center;flex:1 1 220px;min-width:180px;max-width:560px}
@media (max-width:900px){ header .spacer{display:none} header h1{font-size:14px} }
.ask input{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--ink);background:var(--ground);border:1px solid var(--line-2);border-radius:4px;padding:5px 9px}
.ask input::placeholder{color:var(--muted)}
.ask.busy input{opacity:.6}
.clarify{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.clarify b{font-weight:600;font-size:12.5px}
.clarify .c{font:inherit;font-size:12px;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:5px 9px;cursor:pointer;max-width:340px}
.clarify .c:hover{border-color:var(--hop)}
.clarify input{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:5px 9px;min-width:0;width:12em}
.clarify .c small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label.file{position:relative;overflow:hidden}
label.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
aside.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rail .head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.rail .head b{font-weight:600}
.rail .head span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.qlist{overflow:auto;flex:1;min-height:0}
.qitem{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink-2);font:inherit}
.qitem:hover{background:var(--panel-2)}
.qitem.sel{background:var(--panel-2);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.latent{background:var(--latent)} .dot.profile{background:#5FC4D6}
.qitem small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:2px}
main{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 40%,#0F1620 0%,var(--ground)70%)}
canvas{display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-140%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);
  background:rgba(11,15,20,.72);padding:1px 5px;border-radius:3px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.lbl.sel{color:var(--ink);border:1px solid var(--line-2)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:rgba(11,15,20,.6);padding:6px 8px;border-radius:4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.hint{position:absolute;right:12px;top:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
aside.inspector{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.inspector .head{padding:10px 12px;border-bottom:1px solid var(--line)}
.kind{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid currentColor}
.inspector h2{font-size:13.5px;font-weight:500;margin:8px 0 0;line-height:1.4;overflow-wrap:anywhere}
.kv{padding:8px 12px;display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:12.5px}
.kv dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--f-mono);font-size:11.5px}
.kv pre{margin:0;font-family:var(--f-mono);font-size:11px;white-space:pre-wrap;color:var(--ink-2);background:var(--panel-2);padding:6px 8px;border-radius:3px;max-height:220px;overflow:auto}
.chain{padding:8px 12px 14px;border-top:1px solid var(--line)}
.chain h3{font-size:11px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
.chain ol{margin:0;padding-left:18px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.chain li{margin-bottom:4px;overflow-wrap:anywhere}
footer{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
footer input[type=range]{flex:1;accent-color:var(--hop)}
footer .now{min-width:260px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto}
  aside.rail{max-height:160px;border-right:0;border-bottom:1px solid var(--line)}
  aside.inspector{max-height:220px;border-left:0;border-top:1px solid var(--line)}
  footer .now{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
<header>
  <div><h1>Cubby Loop Panel</h1><div class="sub" id="status">sample run · hdc rephrased, host planner</div></div>

</footer>
</div>

            vm:'#E070C8',alias:'#C7B26B',latent:'#E9B44C',answer:'#4ED39A',paraphrase:'#5FC4D6',shared:'#8FA8FF',branch:'#D6A2E8'};
var OK='#4ED39A', BAD='#EF6E6E', LATENT='#E9B44C', LINK='#8FA8FF', PROFILE='#5FC4D6', GAP='#8C96A8';
var RADIUS = {question:2.6,plan:1.9,walk:1.7,hop:1.4,fact:1.2,fetch:1.6,gate:1.1,vm:1.5,alias:1.2,latent:1.5,answer:2.2,paraphrase:1.4,branch:1.6};

var events=[], byId={}, children={}, roots=[], rootOf={}, current=null, mode='tree', selected=null;
var cursor=Infinity, playing=false, playTimer=null;

function verdictOf(ev){
  if(ev.kind==='answer'||ev.kind==='walk'){ if(ev.verified) return 'ok'; if(ev.reason==='latent_only') return 'latent'; if(ev.reason==='profile') return 'profile'; return 'bad'; }
  if(ev.kind==='vm') return ev.verified?'ok':'bad';
  if(ev.kind==='branch') return ev.status==='verified'?'ok':(ev.status==='pruned'?'gap':'bad');   // graph-of-thought (2026-09-24)
  if(ev.kind==='gate') return ev.status==='accepted'||ev.lifted?'ok':(ev.status==='duplicate'?'':'bad');
  return '';
}
function colorOf(ev){
  var v=verdictOf(ev);
  if(ev.kind==='answer'||ev.kind==='walk'||ev.kind==='vm'||ev.kind==='gate'||ev.kind==='branch'){ if(v==='ok') return OK; if(v==='bad') return BAD; if(v==='latent') return LATENT; if(v==='profile') return PROFILE; if(v==='gap') return GAP; }
  return KIND[ev.kind]||'#8393A6';
}
function finalOf(root){
  var kids=children[root.id]||[]; var a=null;
  for(var i=0;i<kids.length;i++) if(kids[i].kind==='answer') a=kids[i];
  return a;
}
function labelOf(ev){
  switch(ev.kind){
    case 'question': return ev.text;
    case 'plan': return (ev.relations||[]).join(' › ')+' · '+(ev.seed||'');
    case 'walk': return (ev.verified?('verified → '+ev.answer):('refused · '+ev.reason))+(ev.n_branches?(' · '+ev.n_branches+' branches'):'');
    case 'branch': return (ev.via||[]).map(function(v){return v.object}).join(' › ')+
      (ev.status==='verified'?(' → '+ev.answer):(ev.status==='pruned'?(' · stalled at '+ev.stalled):(' · '+String(ev.status).replace('_',' ')+(ev.answer?' → '+ev.answer:''))));
    case 'hop': return 'hop '+ev.hop+' · '+ev.how+(ev.similarity!=null?' · '+Number(ev.similarity).toFixed(2):'');
    case 'fact': return ev.text;
    case 'fetch': return ev.source+' ← '+ev.entity+' ('+ev.n+')'+(ev.how?' · '+ev.how:(ev.ambiguous?' · ambiguous ×'+ev.ambiguous.length:''));
    case 'gate': return ev.status+' · '+ev.fact;
    case 'vm': return 'VM '+(ev.verified?'verified':'not verified')+' · '+ev.program_lines+' lines';
    case 'alias': return (ev.pairs||[]).map(function(p){return p[0]+'→'+p[1]}).join(', ');
    case 'shared': return ev.text;
    case 'latent': return 'held: '+ev.answer;
    case 'paraphrase': return ev.ok?('said: '+ev.text):('paraphrase refused · '+(ev.rejected||[]).join(', '));
    case 'answer': return ev.verified?('answer: '+ev.answer):(ev.reason==='profile'?('profile: '+ev.answer):('refused: '+ev.reason));
  }
  return ev.kind;
}

/* links between questions: the same fact walked or admitted under two roots, the same entity fetched twice --
   the store is one, so what one question learned is what the next one walks on (Nick, 2026-09-13) */
var shareKeyOf={}, sharedRoots={};        // event id -> its share key; share key -> Set of root ids
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function shareKey(ev){
  if(ev.kind==='fact') return 'f:'+norm(ev.text);
  if(ev.kind==='gate'&&ev.status==='accepted') return 'f:'+norm(ev.fact);
  if(ev.kind==='hop'&&ev.fact) return 'f:'+norm(ev.fact);
  if(ev.kind==='fetch') return 'e:'+norm(ev.entity);
  return null;
}
function ingest(list, append){
  if(!append){ events=[]; byId={}; children={}; roots=[]; rootOf={}; shareKeyOf={}; sharedRoots={}; }
  list.forEach(function(ev){
    if(byId[ev.id]) return;
    events.push(ev); byId[ev.id]=ev;
    if(ev.parent==null){ roots.push(ev); rootOf[ev.id]=ev.id; }
    else { (children[ev.parent]=children[ev.parent]||[]).push(ev); rootOf[ev.id]=rootOf[ev.parent]!=null?rootOf[ev.parent]:ev.parent; }
    var k=shareKey(ev); if(k){ shareKeyOf[ev.id]=k; (sharedRoots[k]=sharedRoots[k]||new Set()).add(rootOf[ev.id]); }
  });
  renderList();
  document.getElementById('qcount').textContent=roots.length;
}
function otherRootsOf(ev){ var k=shareKeyOf[ev.id]; if(!k) return []; var me=rootOf[ev.id]; return Array.from(sharedRoots[k]||[]).filter(function(r){return r!==me}); }
function linksBetweenRoots(){                       // [rootA, rootB, sharedKeys[]] for every pair sharing a fact or an entity
  var pairs={};
  Object.keys(sharedRoots).forEach(function(k){ var rs=Array.from(sharedRoots[k]).sort(function(a,b){return a-b}); if(rs.length<2||rs.length>12) return;
    for(var i=0;i<rs.length;i++) for(var j=i+1;j<rs.length;j++){ var id=rs[i]+'-'+rs[j]; (pairs[id]=pairs[id]||{a:rs[i],b:rs[j],keys:[]}).keys.push(k); } });
  return Object.keys(pairs).map(function(id){return pairs[id]});
}

/* ---------- three.js scene ---------- */
var canvas=document.getElementById('c'), main=document.getElementById('main');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,1,0.1,4000); camera.position.set(0,0,160);
var group=new THREE.Group(); scene.add(group);
scene.add(new THREE.AmbientLight(0xffffff,0.65));
var key=new THREE.DirectionalLight(0xffffff,0.7); key.position.set(40,80,120); scene.add(key);
var sphereGeo=new THREE.SphereGeometry(1,18,14);
var nodes=[], lines=[], rings=[], meshByEid={};
var labelsEl=document.getElementById('labels');

function clearScene(){
  while(group.children.length) group.remove(group.children[0]);
  nodes=[]; lines=[]; rings=[]; meshByEid={}; labelsEl.innerHTML='';
}
function addNode(ev,x,y,z,r){
  var mat=new THREE.MeshStandardMaterial({color:colorOf(ev),roughness:0.55,metalness:0.1,emissive:new THREE.Color(colorOf(ev)),emissiveIntensity:0.18});
  var m=new THREE.Mesh(sphereGeo,mat); m.position.set(x,y,z); m.scale.setScalar(r); m.userData.ev=ev;
  group.add(m); nodes.push(m); meshByEid[ev.id]=m;
  var l=document.createElement('div'); l.className='lbl'; l.textContent=labelOf(ev); labelsEl.appendChild(l); m.userData.label=l;
  return m;
}
function addLine(a,b,color){
  var g=new THREE.BufferGeometry().setFromPoints([a.position,b.position]);
  var ln=new THREE.Line(g,new THREE.LineBasicMaterial({color:color,transparent:true,opacity:0.55}));
  ln.userData.from=a; ln.userData.to=b; group.add(ln); lines.push(ln);
}

/* the tree: a tidy tree while the fan is small, a DISC around the parent when it is not.
   A fetch admits 172 facts; one slot per leaf put them a screen away from the fetch that pulled
   them (Nick, 2026-09-14: "the related facts are very far away from the source"). A fan wider
   than FAN is laid out as a phyllotaxis disc hanging under its parent, so a cloud of gated facts
   stays a cloud AT its fetch, and the tree keeps its shape where the shape means something. */
var FAN=8;
function layoutTree(root){
  clearScene();
  var placed=[]; var slot=0; var XS=12, YS=16;
  function walk(ev,depth){
    var kids=(children[ev.id]||[]).slice().sort(function(a,b){return a.id-b.id});
    var me={ev:ev,depth:depth,disc:null};
    placed.push(me);
    if(!kids.length){ me.x=slot++; return me; }
    if(kids.length>FAN){                                  // the cloud: reserve the disc's width, place the children in it
      var rad=1.0*Math.sqrt(kids.length), w=Math.max(2,(2*rad*2.6)/XS);
      me.x=slot+w/2; me.disc={r:rad,kids:kids};
      slot+=w;
      kids.forEach(function(k){ placed.push({ev:k,depth:depth+1,inDisc:me}); });
      return me;
    }
    var xs=kids.map(function(k){return walk(k,depth+1).x});
    me.x=(xs[0]+xs[xs.length-1])/2;
    return me;
  }
  walk(root,0);
  var maxDepth=0, maxX=0; placed.forEach(function(p){maxDepth=Math.max(maxDepth,p.depth); maxX=Math.max(maxX,p.x||0)});
  var cx=maxX/2, cy=maxDepth/2;
  var idx={}; placed.slice().sort(function(a,b){return a.ev.id-b.ev.id}).forEach(function(p,i){idx[p.ev.id]=i});
  var golden=Math.PI*(3-Math.sqrt(5));
  placed.forEach(function(p){
    var z=(idx[p.ev.id]/Math.max(1,placed.length-1)-0.5)*18;   // time runs into the screen
    if(p.inDisc){                                              // a child of a big fan: on the disc under its parent
      var d=p.inDisc.disc, i=d.kids.indexOf(p.ev), rr=d.r*2.6*Math.sqrt((i+0.5)/d.kids.length), th=i*golden;
      addNode(p.ev,(p.inDisc.x-cx)*XS+rr*Math.cos(th),(cy-p.depth)*YS-rr*0.45,rr*Math.sin(th)*0.9,RADIUS[p.ev.kind]||1.2);
    } else {
      addNode(p.ev,(p.x-cx)*XS,(cy-p.depth)*YS,z,RADIUS[p.ev.kind]||1.2);
    }
  });
  placed.forEach(function(p){ if(p.ev.parent!=null && meshByEid[p.ev.parent]) addLine(meshByEid[p.ev.parent],meshByEid[p.ev.id],colorOf(p.ev)); });
  // the branches of one walk, linked by what their answers say about each other: green when two certified
  // branches agree (why it could speak), red when they contradict (why it refused)
  placed.forEach(function(p){ if(p.ev.kind!=='walk') return;
    var bs=(children[p.ev.id]||[]).filter(function(e){return e.kind==='branch'&&e.status==='verified'&&meshByEid[e.id]});
    for(var i=0;i<bs.length;i++) for(var j=i+1;j<bs.length;j++)
      addLine(meshByEid[bs[i].id],meshByEid[bs[j].id],norm(bs[i].answer)===norm(bs[j].answer)?OK:BAD); });
  // a fact or entity another question also touched: ringed, its label prefixed ⇄ (the inspector names the questions)
  placed.forEach(function(p){ var others=otherRootsOf(p.ev); if(!others.length) return; var m=meshByEid[p.ev.id];
    var ring=new THREE.Mesh(new THREE.TorusGeometry(1.9,0.12,8,32),new THREE.MeshBasicMaterial({color:LINK,transparent:true,opacity:0.85}));
    ring.position.copy(m.position); ring.scale.setScalar(RADIUS[p.ev.kind]||1.2); ring.userData.follow=m; group.add(ring); rings.push(ring);
    m.userData.label.textContent='⇄ '+m.userData.label.textContent; });
  fit(Math.max(maxX*XS,maxDepth*YS,40));
}

/* the run: questions AND the facts they share, relaxed so a shared fact sits between the questions
   that share it and unlinked questions drift to the rim. The spiral put linked questions wherever
   they arrived and drew a chord across the view; here the layout IS the sharing. Over LIMIT nodes
   the relaxation is skipped and the spiral is ordered by connected component, so the chords stay short. */
var LIMIT=320, runPos={};
function runGraph(){
  var nodes=[], byKey={}, edges=[];
  roots.forEach(function(r){ var n={id:'q'+r.id,ev:r,q:true,heavy:true}; nodes.push(n); byKey[n.id]=n; });
  Object.keys(sharedRoots).forEach(function(k){
    var rs=Array.from(sharedRoots[k]); if(rs.length<2||rs.length>12) return;
    var ev={id:'s:'+k,kind:'shared',text:k.slice(2),shared:(k.charAt(0)==='f'?'fact':'entity'),questions:rs.length,roots:rs};
    var n={id:ev.id,ev:ev,q:false,roots:rs}; nodes.push(n); byKey[n.id]=n;
    rs.forEach(function(rid){ if(byKey['q'+rid]) edges.push({a:byKey['q'+rid],b:n}); });
  });
  return {nodes:nodes,edges:edges,byKey:byKey};
}
function components(){                                   // union-find over the questions, by shared key
  var p={}; roots.forEach(function(r){p[r.id]=r.id});
  function find(x){ while(p[x]!==x) x=p[x]=p[p[x]]; return x; }
  Object.keys(sharedRoots).forEach(function(k){ var rs=Array.from(sharedRoots[k]); if(rs.length>12) return;
    for(var i=1;i<rs.length;i++){ var a=find(rs[0]), b=find(rs[i]); if(a!==b) p[b]=a; } });
  var size={}; roots.forEach(function(r){ var c=find(r.id); size[c]=(size[c]||0)+1; });
  return {of:function(id){return find(id)}, size:size};
}
function relax(g, iters){
  var K=11, nodes=g.nodes;
  var golden=Math.PI*(3-Math.sqrt(5)), fresh=0;
  nodes.forEach(function(n,i){
    var p=runPos[n.id];
    if(p){ n.x=p[0]; n.y=p[1]; n.z=p[2]; }
    else { fresh++; var rad=5*Math.sqrt(i+1), th=i*golden; n.x=rad*Math.cos(th); n.y=rad*Math.sin(th); n.z=(i%7-3)*1.2; }
    n.vx=n.vy=n.vz=0;
  });
  if(fresh) iters=Math.max(iters,200);
  for(var it=0; it<iters; it++){
    var t=0.12*(1-it/iters)+0.02;
    for(var i=0;i<nodes.length;i++){ var a=nodes[i];
      for(var j=i+1;j<nodes.length;j++){ var b=nodes[j];
        var dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z, d2=dx*dx+dy*dy+dz*dz+0.5, d=Math.sqrt(d2);
        var f=(K*K)/d2*((a.heavy&&b.heavy)?1.5:1)/d;
        a.vx+=dx*f; a.vy+=dy*f; a.vz+=dz*f; b.vx-=dx*f; b.vy-=dy*f; b.vz-=dz*f; } }
    g.edges.forEach(function(e){
      var a=e.a,b=e.b, dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z, d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
      var f=(d/K)*0.9;
      a.vx+=dx*f; a.vy+=dy*f; a.vz+=dz*f; b.vx-=dx*f; b.vy-=dy*f; b.vz-=dz*f; });
    nodes.forEach(function(n){
      n.vx-=n.x*0.010; n.vy-=n.y*0.010; n.vz-=n.z*0.045;      // weak centring, flatter in z
      var v=Math.sqrt(n.vx*n.vx+n.vy*n.vy+n.vz*n.vz), cap=6;
      if(v>cap){ n.vx*=cap/v; n.vy*=cap/v; n.vz*=cap/v; }
      n.x+=n.vx*t; n.y+=n.vy*t; n.z+=n.vz*t; n.vx=n.vy=n.vz=0; });
  }
  nodes.forEach(function(n){ runPos[n.id]=[n.x,n.y,n.z]; });
}
function layoutGalaxy(){
  clearScene();
  var n=roots.length, golden=Math.PI*(3-Math.sqrt(5));
  var g=runGraph();
  var relaxed=g.nodes.length<=LIMIT;
  if(relaxed){
    relax(g,70);
  } else {                                                 // too many to relax: the spiral, ordered by component
    var comp=components();
    var ordered=roots.slice().sort(function(a,b){
      var ca=comp.of(a.id), cb=comp.of(b.id);
      if(ca!==cb) return (comp.size[cb]-comp.size[ca]) || (ca-cb);
      return a.id-b.id; });
    g.nodes=[]; g.edges=[];
    ordered.forEach(function(r,i){ var rad=4.2*Math.sqrt(i+1), th=i*golden;
      g.nodes.push({id:'q'+r.id,ev:r,q:true,x:rad*Math.cos(th),y:rad*Math.sin(th),z:(i%7-3)*1.5}); });
  }
  var ext=0;
  g.nodes.forEach(function(nd){
    ext=Math.max(ext,Math.abs(nd.x),Math.abs(nd.y));
    if(nd.q){
      var r=nd.ev, a=finalOf(r);
      var col = a? (a.verified?OK:(a.reason==='latent_only'?LATENT:(a.reason==='profile'?PROFILE:BAD))) : '#8393A6';
      var ev=Object.assign({},r); var m=addNode(ev,nd.x,nd.y,nd.z,1.6);
      m.material.color.set(col); m.material.emissive.set(col);
      m.userData.label.textContent=(a?(a.verified?'✓ ':(a.reason==='profile'?'≡ ':'✗ ')):'')+r.text;
    } else {
      var m2=addNode(nd.ev,nd.x,nd.y,nd.z,0.85);
      m2.material.color.set(LINK); m2.material.emissive.set(LINK);
      m2.userData.label.textContent='⇄ '+nd.ev.text;
    }
  });
  if(relaxed){                                             // question — shared fact — question: the link, through what is shared
    g.edges.forEach(function(e){
      var A=meshByEid[e.a.ev.id], B=meshByEid[e.b.ev.id]; if(!A||!B) return;
      var gg=new THREE.BufferGeometry().setFromPoints([A.position,B.position]);
      var ln=new THREE.Line(gg,new THREE.LineBasicMaterial({color:LINK,transparent:true,opacity:e.b.ev.shared==='fact'?0.55:0.28}));
      ln.userData.from=A; ln.userData.to=B; group.add(ln); lines.push(ln); });
  } else {
    var drawn=0;
    linksBetweenRoots().forEach(function(p){
      if(drawn>=600) return; var A=meshByEid[p.a], B=meshByEid[p.b]; if(!A||!B) return;
      var facts=p.keys.filter(function(k){return k.charAt(0)==='f'}).length;
      var gg=new THREE.BufferGeometry().setFromPoints([A.position,B.position]);
      var ln=new THREE.Line(gg,new THREE.LineBasicMaterial({color:facts?LINK:'#4B5A6E',transparent:true,opacity:facts?0.6:0.3}));
      ln.userData.from=A; ln.userData.to=B; group.add(ln); lines.push(ln); drawn++; });
  }
  fit(Math.max(ext*2.2,40));
}
function fit(extent){ group.rotation.set(0,0,0); camera.position.set(0,0,extent*1.35+30); }

/* orbit: drag rotates, wheel zooms, right-drag / shift-drag pans */
var drag=null;
canvas.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,b:e.button,shift:e.shiftKey,moved:false}; canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',function(e){
  if(!drag) return; var dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(Math.abs(dx)+Math.abs(dy)>2) drag.moved=true;
  if(drag.b===2||drag.shift){ group.position.x+=dx*0.12*camera.position.z/160; group.position.y-=dy*0.12*camera.position.z/160; }
  else { group.rotation.y+=dx*0.006; group.rotation.x+=dy*0.006; }
});
canvas.addEventListener('pointerup',function(e){ if(drag&&!drag.moved) pick(e); drag=null; });
canvas.addEventListener('contextmenu',function(e){e.preventDefault()});
canvas.addEventListener('wheel',function(e){ e.preventDefault(); camera.position.z=Math.max(20,Math.min(1500,camera.position.z*(1+Math.sign(e.deltaY)*0.12))); },{passive:false});

var ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(e){
  var r=canvas.getBoundingClientRect(); mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera); var hits=ray.intersectObjects(nodes.filter(function(n){return n.visible}));
  if(!hits.length) return;
  var ev=hits[0].object.userData.ev;
  if(mode==='galaxy'){ if(ev.kind==='shared'){ select(ev); return; } openTree(byId[ev.id]); return; }
  select(ev);
}
function select(ev){
  selected=ev; nodes.forEach(function(n){ n.userData.label.classList.toggle('sel',n.userData.ev.id===ev.id); n.scale.setScalar((RADIUS[n.userData.ev.kind]||1.2)*(n.userData.ev.id===ev.id?1.45:1)); });
  inspect(ev);
}

function resize(){ var w=main.clientWidth, h=main.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize);

/* labels: projected, ranked (selected, then the question / shared-fact bodies, then the rest), and
   placed only where they do not cover one already placed -- a crowded view drops the least important
   label rather than stacking text on text. Nearer beats farther at the same rank. */
var v=new THREE.Vector3();
var LBL_H=15;
function rank(ev){
  if(selected&&ev.id===selected.id) return 0;
  if(ev.kind==='question') return 1;
  if(ev.kind==='shared') return 2;
  if(ev.kind==='answer') return 3;
  if(ev.kind==='fact'||ev.kind==='hop') return 4;
  return 5;
}
function frame(){
  requestAnimationFrame(frame);
  renderer.render(scene,camera);
  var w=canvas.clientWidth, h=canvas.clientHeight;
  var cand=[];
  nodes.forEach(function(n){
    var l=n.userData.label;
    l.style.display='none';
    if(!n.visible) return;
    v.copy(n.position).applyMatrix4(group.matrixWorld).project(camera);
    if(v.z>1) return;                                        // behind the camera
    cand.push({l:l,n:n,x:(v.x+1)/2*w,y:(1-v.y)/2*h,z:v.z,r:rank(n.userData.ev)});
  });
  cand.sort(function(a,b){ return a.r-b.r || a.z-b.z; });
  var taken=[], shown=0, cap=(mode==='tree'?70:44);
  for(var i=0;i<cand.length && shown<cap;i++){
    var c=cand[i];
    if(c.x<-40||c.x>w+40||c.y<0||c.y>h) continue;
    var tw=Math.min(260,c.l.textContent.length*6.1+10);
    var x0=c.x-tw/2, x1=c.x+tw/2, y1=c.y-LBL_H*0.4, y0=y1-LBL_H;
    var hit=false;
    for(var j=0;j<taken.length;j++){ var t=taken[j];
      if(x0<t[2]&&x1>t[0]&&y0<t[3]&&y1>t[1]){ hit=true; break; } }
    if(hit && c.r>0) continue;                               // the selected label is always placed
    taken.push([x0,y0,x1,y1]);
    c.l.style.display='block'; c.l.style.left=c.x+'px'; c.l.style.top=c.y+'px'; shown++;
  }
  lines.forEach(function(ln){ ln.visible=ln.userData.from.visible&&ln.userData.to.visible; });
  rings.forEach(function(rg){ rg.visible=rg.userData.follow.visible; rg.rotation.y+=0.01; });
}

/* ---------- replay ---------- */
var scrub=document.getElementById('scrub'), posEl=document.getElementById('pos'), nowEl=document.getElementById('now'), playBtn=document.getElementById('btn-play');
function treeEvents(){ return mode==='tree'&&current ? events.filter(function(e){return rootOf[e.id]===current.id}).sort(function(a,b){return a.id-b.id}) : []; }
function applyCursor(){
  var list=treeEvents(); var k=Math.min(cursor,list.length);
  nodes.forEach(function(n){ var i=list.indexOf(n.userData.ev); n.visible = mode!=='tree' || i<k; });
  scrub.max=list.length; scrub.value=k; posEl.textContent=k+' / '+list.length;
  var last=k>0?list[k-1]:null; nowEl.textContent=last?(last.kind+' · '+labelOf(last)):'';
}
scrub.addEventListener('input',function(){ cursor=+scrub.value; applyCursor(); });
playBtn.addEventListener('click',function(){
  if(playing){ playing=false; clearInterval(playTimer); playBtn.textContent='▶ Replay'; return; }
  var list=treeEvents(); if(!list.length) return;
  playing=true; playBtn.textContent='⏸ Pause'; cursor=0; applyCursor();
  playTimer=setInterval(function(){ cursor++; applyCursor(); if(cursor>=list.length){ playing=false; clearInterval(playTimer); playBtn.textContent='▶ Replay'; } },140);
});

/* ---------- panels ---------- */
function renderList(){
  var el=document.getElementById('qlist'); el.innerHTML='';
  roots.forEach(function(r){
    var a=finalOf(r); var b=document.createElement('button'); b.type='button'; b.className='qitem'+(current&&current.id===r.id?' sel':'');
    var d=document.createElement('span'); d.className='dot '+(a?(a.verified?'ok':(a.reason==='latent_only'?'latent':(a.reason==='profile'?'profile':'bad'))):'');
    var t=document.createElement('span'); t.textContent=r.text;
    var s=document.createElement('small'); s.textContent=a?(a.verified?('→ '+a.answer):(a.reason==='profile'?('profile · '+a.answer):a.reason)):'…';
    t.appendChild(s); b.appendChild(d); b.appendChild(t);
    b.addEventListener('click',function(){openTree(r)}); el.appendChild(b);
  });
}
function openTree(r){ mode='tree'; current=r; cursor=Infinity; layoutTree(r); applyCursor(); renderList(); select(r); document.getElementById('status').textContent='question #'+r.id+' · '+treeEvents().length+' events'; }
function openGalaxy(){ mode='galaxy'; current=null; layoutGalaxy(); applyCursor(); renderList(); inspectSummary(); }
document.getElementById('btn-all').addEventListener('click',openGalaxy);

function inspect(ev){
  document.getElementById('ikind').textContent=ev.kind; document.getElementById('ikind').style.color=colorOf(ev);
  document.getElementById('ititle').textContent=labelOf(ev);
  var kv=document.getElementById('ikv'); kv.innerHTML='';
  Object.keys(ev).forEach(function(k){
    if(k==='kind'||k==='parent'||k==='t') return;
    var val=ev[k]; if(val==null||val===''||(Array.isArray(val)&&!val.length)) return;
    var dt=document.createElement('dt'); dt.textContent=k; var dd=document.createElement('dd');
    if(typeof val==='object'){ var pre=document.createElement('pre'); pre.textContent=JSON.stringify(val,null,1); dd.appendChild(pre); }
    else { dd.textContent=String(val); dd.className=(k==='id'||k==='similarity'||k==='n_hop'||k==='program_lines')?'mono':''; }
    kv.appendChild(dt); kv.appendChild(dd);
  });
  var ch=document.getElementById('ichain'); ch.hidden=true; var old=document.getElementById('ishared'); if(old) old.remove();
  if(ev.kind==='walk'||ev.kind==='answer'){
    var root=byId[rootOf[ev.id]]; var walks=events.filter(function(e){return e.kind==='walk'&&rootOf[e.id]===root.id});
    var w=ev.kind==='walk'?ev:walks[walks.length-1];
    if(w){ var hops=(children[w.id]||[]).filter(function(e){return e.kind==='hop'});
      var brs=(children[w.id]||[]).filter(function(e){return e.kind==='branch'});
      if(hops.length){ ch.hidden=false; ch.innerHTML='<h3>'+(brs.length?'the hops every branch shares':'the chain the VM checked')+'</h3>'; var ol=document.createElement('ol');
        hops.forEach(function(h){ var li=document.createElement('li'); li.textContent=(h.fact||h.query)+(h.provenance?'  ['+h.provenance+']':''); ol.appendChild(li); }); ch.appendChild(ol); }
      if(brs.length){ ch.hidden=false; var h3=document.createElement('h3'); h3.textContent='the branches ('+brs.length+')'; ch.appendChild(h3); var ul=document.createElement('ul');
        brs.forEach(function(b){ var li=document.createElement('li'); li.textContent=labelOf(b); li.style.color=colorOf(b); ul.appendChild(li); }); ch.appendChild(ul); } }
  }
  if(ev.kind==='branch'&&byId[ev.parent]){
    var pre=(children[ev.parent]||[]).filter(function(e){return e.kind==='hop'}), own=(children[ev.id]||[]).filter(function(e){return e.kind==='hop'});
    ch.hidden=false; ch.innerHTML='<h3>this branch, end to end</h3>'; var ob=document.createElement('ol');
    pre.concat(own).forEach(function(h){ var li=document.createElement('li'); li.textContent=h.fact||h.query; ob.appendChild(li); }); ch.appendChild(ob);
  }
  // the link: the same fact / entity under other questions -- click one to open its tree
  var others=ev.kind==='shared'?ev.roots:otherRootsOf(ev);
  if(others.length){
    var sh=document.createElement('div'); sh.className='chain'; sh.id='ishared'; sh.innerHTML='<h3>'+(ev.kind==='shared'?('the same '+ev.shared+' in '+others.length+' questions'):((shareKeyOf[ev.id].charAt(0)==='f'?'the same fact':'the same entity')+' in '+others.length+' other question'+(others.length>1?'s':'')))+'</h3>';
    others.forEach(function(rid){ var r=byId[rid]; if(!r) return; var a=finalOf(r); var b=document.createElement('button'); b.type='button'; b.className='qitem';
      var d=document.createElement('span'); d.className='dot '+(a?(a.verified?'ok':(a.reason==='latent_only'?'latent':(a.reason==='profile'?'profile':'bad'))):''); var t=document.createElement('span'); t.textContent=r.text;
      var s=document.createElement('small'); s.textContent=a?(a.verified?('→ '+a.answer):(a.reason==='profile'?('profile · '+a.answer):a.reason)):'…'; t.appendChild(s); b.appendChild(d); b.appendChild(t);
      var key=ev.kind==='shared'?ev.id.slice(2):shareKeyOf[ev.id];
      b.addEventListener('click',function(){ openTree(r); var m=null; nodes.forEach(function(n){ if(shareKeyOf[n.userData.ev.id]===key) m=m||n; }); if(m) select(m.userData.ev); });
      sh.appendChild(b); });
    ch.parentNode.appendChild(sh);
  }
}
function inspectSummary(){
  var ok=0,bad=0,lat=0; roots.forEach(function(r){var a=finalOf(r); if(!a) return; if(a.verified) ok++; else if(a.reason==='latent_only') lat++; else bad++;});
  document.getElementById('ikind').textContent='run'; document.getElementById('ikind').style.color='var(--ink-2)';
  document.getElementById('ititle').textContent=roots.length+' questions · '+ok+' verified · '+bad+' refused'+(lat?' · '+lat+' held (latent)':'');
  var kv=document.getElementById('ikv'); kv.innerHTML='';
  var reasons={}; roots.forEach(function(r){var a=finalOf(r); if(a&&!a.verified) reasons[a.reason]=(reasons[a.reason]||0)+1;});
  Object.keys(reasons).sort(function(a,b){return reasons[b]-reasons[a]}).forEach(function(k){ var dt=document.createElement('dt'); dt.textContent=k; var dd=document.createElement('dd'); dd.className='mono'; dd.textContent=reasons[k]; kv.appendChild(dt); kv.appendChild(dd); });
  document.getElementById('ichain').hidden=true; var old=document.getElementById('ishared'); if(old) old.remove();
  document.getElementById('status').textContent=events.length+' events · click a question to open its tree';
}

/* legend */
(function(){ var lg=document.getElementById('legend'); Object.keys(KIND).forEach(function(k){ if(k==='answer') return; var s=document.createElement('span'); s.innerHTML='<i style="background:'+KIND[k]+'"></i>'+k; lg.appendChild(s); });
  [['verified',OK],['refused',BAD],['gap · the store has no way on',GAP],['held · latent',LATENT],['profile · a readout of the store',PROFILE],['⇄ linked · shared fact / entity',LINK]].forEach(function(p){ var s=document.createElement('span'); s.innerHTML='<i style="background:'+p[1]+'"></i>'+p[0]; lg.appendChild(s); }); })();

/* loading: a file, the embedded sample, or a live stream from a local stand-in server */
function parseJsonl(text){ var out=[]; text.split(/\r?\n/).forEach(function(l){ l=l.trim(); if(!l) return; try{ out.push(JSON.parse(l)); }catch(e){} }); return out; }
document.getElementById('file').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
  rd.onload=function(){ ingest(parseJsonl(rd.result),false); document.getElementById('status').textContent=f.name; openGalaxy(); }; rd.readAsText(f);
});
var es=null, pending=[], follow=null;            // follow: the question text whose tree the panel opens as it grows (the ask box)
var base=(location.protocol.indexOf('http')===0?'':'http://127.0.0.1:8765');   // the stand-in server: python standin/serve_api.py --ask, then /panel
var liveBtn=document.getElementById('btn-live');
function connectLive(){
  if(es) return;
  var url=base+'/loop/stream';
  try{ es=new EventSource(url); }catch(err){ document.getElementById('status').textContent='no live stream at '+url; return; }
  liveBtn.textContent='● Live';
  ingest([],false); current=null; mode='galaxy'; layoutGalaxy();       // the server's ids start at 1 like the sample's: the stream replaces what was loaded
  document.getElementById('status').textContent='live · '+url;
  es.onmessage=function(m){ try{ pending.push(JSON.parse(m.data)); }catch(err){} };
  es.onerror=function(){ document.getElementById('status').textContent='live stream unreachable — open this panel from the stand-in server (serve_api.py, /panel)'; es.close(); es=null; liveBtn.textContent='Live'; };
}
liveBtn.addEventListener('click',function(){ if(es){ es.close(); es=null; this.textContent='Live'; return; } connectLive(); });
setInterval(function(){
  if(!pending.length) return;
  var batch=pending.splice(0); ingest(batch,true);
  if(follow){                                      // the asked question's tree, opened the moment its root arrives, redrawn per hop
    for(var i=roots.length-1;i>=0;i--){ if(roots[i].text===follow){ if(current!==roots[i]) openTree(roots[i]); break; } }
  }
  if(mode==='galaxy') layoutGalaxy(); else if(current){ layoutTree(current); applyCursor(); }
},250);

/* the ask box: POST /ask on the stand-in server; every step of the loop arrives on the stream while the answer is computed */
var askForm=document.getElementById('ask'), askText=document.getElementById('ask-text'), askBtn=document.getElementById('ask-btn');
var clarifyEl=document.getElementById('clarify');
function askerId(){                                 // a stable id per browser: the ledger counts ASKERS, not questions
  var k='cubby.asker';
  try{ var v=localStorage.getItem(k); if(!v){ v='a'+Math.random().toString(36).slice(2,10); localStorage.setItem(k,v); } return v; }
  catch(e){ return 'anon'; }
}
function showClarify(q,c){                          // the asker decides; the host never picks (2026-09-14)
  clarifyEl.innerHTML=''; if(!c||!c.choices||!c.choices.length){ clarifyEl.hidden=true; return; }
  var b=document.createElement('b'); b.textContent=c.question||'Which one do you mean?'; clarifyEl.appendChild(b);
  c.choices.slice(0,6).forEach(function(ch){
    var el=document.createElement('button'); el.type='button'; el.className='c';
    el.appendChild(document.createTextNode(ch.label||ch.item||'?'));
    if(ch.detail){ var s=document.createElement('small'); s.textContent=ch.detail; el.appendChild(s); }
    el.addEventListener('click',function(){ clarifyEl.hidden=true; sendAsk(q,ch.item,ch.choose); });   // an entity (item) or a path (choose)
    clarifyEl.appendChild(el); });
  var no=document.createElement('button'); no.type='button'; no.className='c'; no.textContent='none of these';
  no.addEventListener('click',function(){ clarifyEl.hidden=true; }); clarifyEl.appendChild(no);
  clarifyEl.hidden=false;
}
function showTeach(rec){                           // a relation ask: the asker can confirm, correct, or teach (AskLoop.feedback)
  clarifyEl.innerHTML=''; if(!rec||rec.kind!=='relation'||!rec.id){ clarifyEl.hidden=true; return; }
  var b=document.createElement('b');
  b.textContent=rec.verified?'Is that right?':'Do you know how they are related? A night with two askers who agree teaches the rule.';
  clarifyEl.appendChild(b);
  function send(body,done){
    fetch(base+'/ask/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({id:rec.id,asker:askerId()},body))})
      .then(function(r){ return r.json(); })
      .then(function(o){ document.getElementById('status').textContent=o.error?('feedback not taken: '+o.error):done(o); clarifyEl.hidden=true; })
      .catch(function(err){ document.getElementById('status').textContent='feedback unreachable: '+err; });
  }
  if(rec.verified){
    var ok=document.createElement('button'); ok.type='button'; ok.className='c'; ok.textContent='right';
    ok.addEventListener('click',function(){ send({verdict:'right'},function(){ return 'thanks — kept for tonight\'s sleep'; }); });
    clarifyEl.appendChild(ok);
  }
  var inp=document.createElement('input'); inp.type='text'; inp.id='teach-relation'; inp.placeholder=rec.verified?'no, it is…':'the relation, e.g. aunt';
  inp.setAttribute('aria-label','the relation');
  var go=document.createElement('button'); go.type='button'; go.className='c'; go.textContent=rec.verified?'correct it':'teach';
  go.addEventListener('click',function(){ var v=inp.value.replace(/\s+/g,' ').trim(); if(!v) return;
    send({relation:v},function(o){ return (o.verdict==='wrong'?'recorded as wrong; ':'')+'"'+o.relation+'" becomes an episode tonight'; }); });
  clarifyEl.appendChild(inp); clarifyEl.appendChild(go);
  clarifyEl.hidden=false;
}
function sendAsk(q,item,choose){
  connectLive(); follow=q; askForm.classList.add('busy'); askBtn.textContent='…'; askBtn.disabled=true;
  clarifyEl.hidden=true;
  document.getElementById('status').textContent='asking: '+q+(item?(' ['+item+']'):'')+(choose?(' ['+choose.map(function(c){return c.object}).join(' › ')+']'):'');
  fetch(base+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({text:q,asker:askerId()},item?{item:item}:{},choose?{choose:choose}:{}))})
    .then(function(r){ return r.json(); })
    .then(function(rec){
      document.getElementById('status').textContent=rec.error?('ask failed: '+rec.error):
        (rec.verified?('answer: '+(rec.statement||rec.answer)+' — VM-verified, '+rec.wall_s+' s'):
         (rec.reason==='profile'?('profile (from the store, not a walk): '+rec.answer+' — '+rec.wall_s+' s'):
          ('refused: '+rec.reason+(rec.needs?' — '+rec.needs:'')+' — '+rec.wall_s+' s')));
      if(rec.kind==='relation') showTeach(rec);
      else if(rec.clarify) showClarify(q,rec.clarify);
      else if(rec.reason==='ambiguous_hop'&&rec.refused&&rec.refused.verified_answers&&rec.refused.verified_answers.length>1)
        document.getElementById('status').textContent+=' — several certified answers: '+rec.refused.verified_answers.join(', ');
      askText.value=''; })
    .catch(function(err){ document.getElementById('status').textContent='ask unreachable: '+err; })
    .then(function(){ askForm.classList.remove('busy'); askBtn.textContent='Ask'; askBtn.disabled=false; askText.focus(); setTimeout(function(){ follow=null; },2000); });
}
askForm.addEventListener('submit',function(e){
  e.preventDefault();
  var q=askText.value.replace(/\s+/g,' ').trim(); if(!q||askForm.classList.contains('busy')) return;
  sendAsk(q,null,null);
});
if(location.protocol.indexOf('http')===0){          // served by the stand-in: the ask box shows when the loop is mounted, and the stream connects
  fetch(base+'/health').then(function(r){ return r.json(); }).then(function(h){
    if(h.ask){ askForm.hidden=false; askText.placeholder='Ask a question — '+(h.ask_source||'')+' behind the gate'; }
    connectLive();
  }).catch(function(){});
}

resize();
ingest(parseJsonl(document.getElementById('sample').textContent),false);
openTree(roots[6]||roots[0]);
frame();
})();
</script>
