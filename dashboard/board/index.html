<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubby · Board</title>
<link rel="stylesheet" href="/board/static/board.css">
</head>
<body>
<div class="cb">
<div class="shell">
<header class="top">
  <a class="brand" href="#home"><b>Cubby</b><span class="chip" id="aud-chip">public</span></a>
  <nav class="nav glass" aria-label="Sections" id="nav">
    <a href="#home" data-v="home" title="Home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#watch" data-v="watch" title="World Watch"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span class="sr">World Watch</span></a>
    <a href="#chat" data-v="chat" title="Chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="sr">Chat</span></a>
    <a href="#worlds" data-v="worlds" title="Worlds"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="sr">Worlds</span></a>
    <a href="#forecast" data-v="forecast" title="Forecast"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12h10M7 11l10-5M7 13l10 5"/></svg><span class="sr">Forecast</span></a>
    <a href="#mood" data-v="mood" title="Mood"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="sr">Mood</span></a>
    <a href="#system" data-v="system" title="System"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span class="sr">System</span></a>
    <a href="#plugins" data-v="plugins" title="Plugins"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v4M15 3v4M7 7h10v5a5 5 0 0 1-10 0z"/><path d="M12 17v4"/></svg><span class="sr">Plugins</span></a>
    <a href="#agents" data-v="agents" title="Agents (planned)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span class="sr">Agents (planned)</span></a>
  </nav>
  <button class="pill glass" id="pub" aria-pressed="true" title="Public: the server sends what any user may see">
    <span>Public</span><span class="sw on" id="pub-sw"><i></i></span>
  </button>
</header>
<main id="views">
  <section class="view" id="v-home" aria-label="Home"></section>
  <section class="view" id="v-chat" aria-label="Chat" hidden></section>
  <section class="view" id="v-system" aria-label="System" hidden></section>
  <section class="view" id="v-plugins" aria-label="Plugins" hidden></section>
  <section class="view" id="v-mood" aria-label="Mood" hidden></section>
  <section class="view" id="v-empty" aria-label="Section" hidden></section>
</main>
</div>
</div>
<script type="module" src="/board/static/app.js"></script>
</body>
</html>
